services:

  database:
    image: mariadb:12.1.2
    container_name: ${APP_NAME}_mariadb
    ports:
      - 127.0.0.1:${DB_PORT}:3306
    volumes:
      - "./data/mysql:/var/lib/mysql"
    restart: always
    env_file:
      - .env
    networks:
      - app_network

  elasticsearch:
    image: elasticsearch:${ES_VERSION}
    container_name: ${APP_NAME}_elasticsearch
    ports:
      - 127.0.0.1:${ES_PORT}:9200
    volumes:
      - "./config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml"
      - "./data/elasticsearch:/usr/share/elasticsearch/data"
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ES_PASSWORD}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    restart: always
    networks:
      - app_network

  redis:
    container_name: ${APP_NAME}_redis
    image: redis:8.4
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - "./data/redis:/data"
    ports:
      - 127.0.0.1:${REDIS_PORT}:6379
    restart: always
    networks:
      - app_network

  php:
    container_name: ${APP_NAME}_php
    build:
      context: ./src
      dockerfile: ./php/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION}
        PHALCON_VERSION: ${PHALCON_VERSION}
    working_dir: /var/www/html
    volumes:
      - "./config/php/timezone.ini:/usr/local/etc/php/conf.d/timezone.ini"
      - "./config/php/file.ini:/usr/local/etc/php/conf.d/file.ini"
      - "./config/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini"
      - "./config/crontabs/root:/var/spool/cron/crontabs/root"
      - "${APP_ROOT}:/var/www/html"
    depends_on:
      - database
      - redis
      - elasticsearch
    command: ["php-fpm"]
    restart: always
    networks:
      - app_network

  nginx:
    container_name: ${APP_NAME}_nginx
    build:
      context: ./src
      dockerfile: ./nginx/Dockerfile
    command: ["nginx", "-g", "daemon off;"]
    working_dir: /var/www/html
    depends_on:
      - php
    volumes:
      - "./config/nginx/conf.d:/etc/nginx/conf.d/"
      - "./data/nginx:/var/log/nginx"
      - "${APP_ROOT}:/var/www/html"
    ports:
      - ${APP_PORT}:80
    restart: always
    networks:
      - app_network

  phpmyadmin:
    container_name: ${APP_NAME}_phpmyadmin
    image: phpmyadmin/phpmyadmin
    depends_on:
      - database
    ports:
      - ${PMA_PORT}:80
    environment:
      PMA_HOST: database
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - app_network

networks:
  app_network:
    name: ${APP_NAME}
    driver: bridge
